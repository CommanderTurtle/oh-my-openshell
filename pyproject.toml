[project]
name = "omosh"
version = "0.1.0"
description = "Local OpenShell configuration, sessions, and command bridge"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.38,<1",
  "httpx>=0.28,<1",
  "tomlkit>=0.13,<1",
  "pyyaml>=6.0.3,<7",
]

[project.scripts]
omosh = "omosh.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omosh"]
exclude = ["src/omosh/source.tar.gz"]

[tool.hatch.build.targets.wheel.force-include]
"src/omosh/static/vendor" = "omosh/static/vendor"
"LICENSE" = "omosh/legal/LICENSE"
"NOTICE" = "omosh/legal/NOTICE"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
